  <title>Paris Nails – manikyr og pedikyr i Norheimsund</title>

  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Paris Nails – manikyr og pedikyr i Norheimsund">
  <meta property="og:description" content="Bestill time, ring oss eller finn veien til Grova 40.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">

  <style>
    :root {
      --blush: #F9EAEA;        /* page */
      --white: #FFFDFC;        /* card, like the price list */
      --pill: #F7DADA;         /* price-tag pink */
      --pill-hover: #F3CFCF;
      --line: #B8955A;         /* gold line art */
      --line-faint: #DCC395;
      --gold: #8F7227;         /* logo foil */
      --ink: #3D3133;

      --font: "Marcellus", "Didot", "Bodoni 72", Georgia, serif;
      --column: min(100% - 32px, 400px);
      --ease-out: cubic-bezier(.22, .8, .3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--blush);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- gold line art ---------- */
    .art {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .art .ln {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .art .ln.fill { fill: var(--blush); }
    .art .ln.thin { stroke-width: .8; }
    .art .dot { fill: var(--line); }

    .art--faint .ln { stroke: var(--line-faint); stroke-width: .55; }
    .art--faint .ln.thin { stroke-width: .4; }
    .art--faint .dot { fill: var(--line-faint); }

    .sprig--top    { top: -22px;  right: calc(50% - 222px); width: 240px; }
    .sprig--bottom { bottom: -14px; left: calc(50% - 236px); width: 180px; }
    .bloom--a { top: -96px;    left: calc(50% - 300px); width: 240px; transform: rotate(12deg); }
    .bloom--b { bottom: -130px; right: calc(50% - 300px); width: 270px; transform: rotate(-8deg); }
    .art--faint { --faint: .55; opacity: .55; }

    /* ---------- content ---------- */
    main {
      position: relative;
      z-index: 1;
      width: var(--column);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 124px 0 28px;
    }
    /* sit a little above centre on tall screens */
    main::before, main::after { content: ""; }
    main::before { flex: 1; }
    main::after  { flex: 2.5; }

    .logo {
      width: 100%;
      max-width: 340px;
      margin: 0;
    }
    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .tagline {
      margin: 14px 0 0;
      font-size: 1rem;
      letter-spacing: .08em;
      color: var(--ink);
      opacity: .75;
    }

    .links {
      list-style: none;
      margin: 28px 0 0;
      padding: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .links li { display: contents; }

    .link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 9px 14px;
      border-radius: 999px;
      text-decoration: none;
      text-align: center;
      color: var(--ink);
      background: var(--pill);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .7) inset,
        0 6px 16px -8px rgba(201, 120, 125, .55);
      transition: background-color .2s ease, box-shadow .2s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover {
      background: var(--pill-hover);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .7) inset,
        0 8px 20px -8px rgba(201, 120, 125, .7);
    }
    .link:active { transform: scale(.98); }
    .link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .title {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 1.0625rem;
      line-height: 1.25;
    }
    .title svg {
      width: 19px;
      height: 19px;
      flex: none;
      color: var(--gold);
    }
    .sub {
      font-size: .8125rem;
      letter-spacing: .02em;
      opacity: .72;
      line-height: 1.3;
      margin-top: 2px;
    }

    .link--wide { grid-column: 1 / -1; }

    /* booking: white card with a gold double rule, like the price list */
    .link--book {
      grid-column: 1 / -1;
      min-height: 78px;
      margin-bottom: 4px;
      background: var(--white);
      box-shadow:
        0 0 0 1.5px var(--line),
        inset 0 0 0 4px var(--white),
        inset 0 0 0 5px rgba(184, 149, 90, .35),
        0 10px 26px -12px rgba(201, 120, 125, .6);
    }
    .link--book:hover {
      background: #FFF7F6;
      box-shadow:
        0 0 0 2px var(--line),
        inset 0 0 0 4px #FFF7F6,
        inset 0 0 0 5px rgba(184, 149, 90, .5),
        0 12px 30px -12px rgba(201, 120, 125, .7);
    }
    .link--book .title { font-size: 1.375rem; gap: 11px; }
    .link--book .title svg { width: 22px; height: 22px; }
    .link--book .sub { font-size: .875rem; }

    footer {
      position: relative;
      z-index: 1;
      padding: 0 16px calc(28px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: .875rem;
      line-height: 1.7;
    }
    footer a {
      color: var(--ink);
      text-decoration: none;
      opacity: .78;
    }
    footer a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }

    /* ---------- the one orchestrated moment: the gold lines draw in ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .sprig .ln {
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        animation: draw 1.5s var(--ease-out) forwards;
        animation-delay: calc(.15s + var(--i, 0) * 35ms);
      }
      .sprig .dot {
        opacity: 0;
        animation: fade .6s ease 1.5s forwards;
      }
      .art--faint {
        opacity: 0;
        animation: fade-faint 2.4s ease .3s forwards;
      }
      .logo, .tagline, .links, footer {
        opacity: 0;
        animation: rise .9s var(--ease-out) forwards;
      }
      .logo    { animation-delay: .2s; }
      .tagline { animation-delay: .45s; }
      .links   { animation-delay: .6s; }
      footer   { animation-delay: .9s; }

      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes fade-faint { to { opacity: var(--faint, .55); } }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); filter: blur(3px); }
        to   { opacity: 1; transform: none; filter: none; }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }

    @media (min-width: 640px) {
      main { padding-top: 160px; }
      .logo { max-width: 360px; }
      .sprig--top    { top: 0; width: 360px; right: calc(50% - 330px); }
      .sprig--bottom { width: 260px; left: calc(50% - 420px); bottom: 0; }
      .bloom--a { width: 380px; left: calc(50% - 540px); top: -120px; }
      .bloom--b { width: 420px; right: calc(50% - 580px); bottom: -140px; }
      .art--faint { --faint: .75; opacity: .75; }
    }
  </style>
</head>
