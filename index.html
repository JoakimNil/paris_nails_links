<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paris Nails – manikyr og pedikyr i Norheimsund</title>
  <meta name="description" content="Bestill time hos Paris Nails, Grova 40 i Norheimsund. Ring 403 27 078, eller følg oss på Instagram og Facebook.">
  <meta name="theme-color" content="#F9EAEA">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Paris Nails – manikyr og pedikyr i Norheimsund">
  <meta property="og:description" content="Bestill time, ring oss eller finn veien til Grova 40.">
  <meta property="og:image" content="https://joakimnil.github.io/paris_nails_links/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">

  <style>
    :root {
      --blush: #F9EAEA;        /* page, like the price list */
      --white: #FFFDFC;        /* booking card */
      --pill: #F7DADA;         /* price-tag pink */
      --pill-hover: #F3CFCF;
      --line: #B8955A;         /* gold rule */
      --gold: #8F7227;         /* logo foil */
      --ink: #3D3133;

      --font: "Marcellus", "Didot", "Bodoni 72", Georgia, serif;
      --column: min(100% - 40px, 400px);
      --gap: 18px;             /* between buttons */
      --ease-out: cubic-bezier(.22, .8, .3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--blush);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- content ---------- */
    main {
      position: relative;
      z-index: 1;
      width: var(--column);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 0 0;
    }

    .logo {
      width: 100%;
      max-width: 232px;
      margin: 0;
    }
    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .links {
      list-style: none;
      margin: 34px 0 0;
      padding: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }
    .links li { display: contents; }

    .link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      text-align: center;
      color: var(--ink);
      background: var(--pill);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .7) inset,
        0 8px 18px -8px rgba(201, 120, 125, .55);
      transition: background-color .2s ease, box-shadow .2s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover {
      background: var(--pill-hover);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .7) inset,
        0 10px 22px -8px rgba(201, 120, 125, .7);
    }
    .link:active { transform: scale(.98); }
    .link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .title {
      font-size: 1.0625rem;
      line-height: 1.25;
      letter-spacing: .01em;
    }
    .sub {
      font-size: .8125rem;
      letter-spacing: .03em;
      opacity: .72;
      line-height: 1.3;
      margin-top: 3px;
    }

    .link--wide { grid-column: 1 / -1; }

    /* booking: white card with a gold double rule, like the price list */
    .link--book {
      grid-column: 1 / -1;
      min-height: 80px;
      margin-bottom: 6px;
      background: var(--white);
      box-shadow:
        0 0 0 1.5px var(--line),
        inset 0 0 0 4px var(--white),
        inset 0 0 0 5px rgba(184, 149, 90, .35),
        0 12px 28px -12px rgba(201, 120, 125, .6);
    }
    .link--book:hover {
      background: #FFF7F6;
      box-shadow:
        0 0 0 2px var(--line),
        inset 0 0 0 4px #FFF7F6,
        inset 0 0 0 5px rgba(184, 149, 90, .5),
        0 14px 32px -12px rgba(201, 120, 125, .7);
    }
    .link--book .title { font-size: 1.375rem; letter-spacing: .02em; }
    .link--book .sub { font-size: .875rem; }

    /* ---------- the rose spray: one drawn element, tucked into the corner ---------- */
    .spray-wrap {
      align-self: flex-end;
      margin-top: auto;
      padding-top: 32px;
      width: min(78%, 330px);
    }
    .spray {
      position: relative;
      z-index: 0;
      display: block;
      width: 100%;
      height: auto;
      margin: 0 -12px 0 0;
      opacity: .9;
      pointer-events: none;
      user-select: none;
    }
    .spray--top { display: none; }

    /* ---------- entrance: content settles, then the spray develops from the corner ---------- */
    @media (prefers-reduced-motion: no-preference) {
      main {
        opacity: 0;
        animation: rise .9s var(--ease-out) .1s forwards;
      }
      .spray {
        /* a soft wipe that grows out of the corner where the stems meet */
        -webkit-mask-image: linear-gradient(315deg, #000 40%, transparent 75%);
                mask-image: linear-gradient(315deg, #000 40%, transparent 75%);
        -webkit-mask-size: 300% 300%;
                mask-size: 300% 300%;
        -webkit-mask-position: 0% 0%;
                mask-position: 0% 0%;
        animation: develop 1.9s var(--ease-out) .5s forwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes develop {
        from { -webkit-mask-position: 0% 0%; mask-position: 0% 0%; }
        to   { -webkit-mask-position: 100% 100%; mask-position: 100% 100%; }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }

    @media (min-width: 640px) {
      main { padding-top: 48px; }
      .logo { max-width: 300px; }
      .links { margin-top: 40px; }
    }

    /* desktop: the spray sits in the corner of the window, with its mirror at the top */
    @media (min-width: 960px) and (min-height: 640px) {
      .page { justify-content: center; }
      main { padding: 40px 0 72px; }
      .spray-wrap { display: contents; }
      .spray {
        position: fixed;
        right: -48px;
        bottom: -40px;
        width: 560px;
        margin: 0;
      }
      .spray--top {
        display: block;
        right: auto;
        bottom: auto;
        left: -48px;
        top: -40px;
        width: 380px;
        transform: rotate(180deg);
        opacity: .75;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <h1 class="logo">
        <picture>
          <source srcset="assets/logo.webp" type="image/webp">
          <img src="assets/logo.png" width="1312" height="348" alt="Paris Nails – manikyr og pedikyr">
        </picture>
      </h1>

      <ul class="links">
        <li>
          <a class="link link--book" href="https://booksalon.no/paris-nails">
            <span class="title">Bestill time</span>
            <span class="sub">Se ledige timer hos Booksalon</span>
          </a>
        </li>
        <li>
          <a class="link link--wide" href="tel:+4740327078">
            <span class="title">403 27 078</span>
            <span class="sub">Ring oss</span>
          </a>
        </li>
        <li>
          <a class="link link--wide" href="https://www.google.com/maps/search/?api=1&amp;query=Paris%20Nails%2C%20Grova%2040%2C%205600%20Norheimsund">
            <span class="title">Grova 40, 5600 Norheimsund</span>
            <span class="sub">Åpne i Google Maps</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://www.instagram.com/parisnails.norheimsund/">
            <span class="title">Instagram</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://www.facebook.com/ParisNails.Norheimsund/">
            <span class="title">Facebook</span>
          </a>
        </li>
        <li>
          <a class="link link--wide" href="https://g.page/r/Cay3l_S3LwZ9EBM/review">
            <span class="title">Gi oss en anmeldelse på Google</span>
          </a>
        </li>
      </ul>
    </main>

    <div class="spray-wrap">
      <img class="spray" src="assets/spray.svg" width="600" height="480" alt="" aria-hidden="true">
      <img class="spray spray--top" src="assets/spray.svg" width="600" height="480" alt="" aria-hidden="true">
    </div>
  </div>
</body>
</html>
